<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swastha Sathi - Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="glass-container">
        <header>
            <div class="logo">
                <span class="icon">🌿</span>
                <h1>Swastha Sathi</h1>
            </div>
            <div class="status-indicator" id="statusIndicator">
                <div class="pulse"></div>
                <span id="statusText">Ready</span>
            </div>
        </header>

        <main>
            <div class="chat-container" id="chatContainer">
                <div class="message system">
                    नमस्ते! म स्वस्थ साथी हुँ। मलाई तपाईंको स्वास्थ्यसम्बन्धी प्रश्नहरू सोध्नुहोस्।
                </div>
            </div>
        </main>

        <div class="controls-area">
            <div class="recording-visualizer hidden" id="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            
            <button id="micBtn" class="mic-btn" aria-label="Start Recording">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
            </button>
            <p class="instruction" id="instructionText">Tap to speak</p>
        </div>
    </div>
    
    <!-- Audio element for playing assistant replies -->
    <audio id="audioPlayer" autoplay></audio>

    <script src="app.js"></script>
</body>
</html>
